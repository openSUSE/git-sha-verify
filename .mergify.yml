---
pull_request_rules:
  - name: automatic merge
    conditions:
      - and: &base_checks
          - base=main
          - -label~=^acceptance-tests-needed|not-ready
          - "#check-failure=0"
          - "#check-pending=0"
          - linear-history
          # Matches workflow job id 'test' in .github/workflows/python-app.yml
          - check-success=test
      - and:
          - "#approved-reviews-by>=2"
          - "#changes-requested-reviews-by=0"
    actions: &merge
      merge:
        method: fast-forward
  - name: automatic merge on special label
    conditions:
      - and: *base_checks
      - "label=merge-fast"
    actions: *merge
  - name: automatic merge for dependabot updates that only bump dependencies
    conditions:
      - and: *base_checks
      - and: &bot_gate
          - author=dependabot[bot]
          - "#changes-requested-reviews-by=0"
      # A commit pushed on top of the bot's own is a code change, not a bump
      - "#commits=1"
      # A bump only writes these paths; anything else needs review
      - -files~=^(?!(uv\.lock|pyproject\.toml|\.github/workflows/[^/]+\.ya?ml)$).+
    actions: &squash
      merge:
        method: squash
  - name: require review for other dependabot updates
    conditions:
      - and: *base_checks
      - and: *bot_gate
      - "#approved-reviews-by>=1"
    actions: *squash

merge_protections_settings:
  auto_merge_conditions: *base_checks
  post_comment: false

merge_queue:
  max_parallel_checks: 3
  status_comments: none
  queue_controls_comment: false
